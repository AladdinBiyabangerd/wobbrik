// Disposable host check using cached Robolectric; no project dependency or CI changes.
gradle.beforeProject { app ->
    if (app.path == ':app') app.plugins.withId('com.android.application') {
        app.android.testOptions.unitTests.includeAndroidResources = true
        app.android.sourceSets.test.java.srcDir(new File(app.rootDir, '../docs/reviews/connectivity-retry/host'))
        app.dependencies.add('testImplementation', 'org.robolectric:robolectric:4.14.1')
        app.tasks.withType(Test).configureEach {
            systemProperty 'robolectric.offline', 'true'
            systemProperty 'robolectric.dependency.dir', '/private/tmp/wobbrik-android-jars'
            maxHeapSize = '2g'
        }
    }
}
